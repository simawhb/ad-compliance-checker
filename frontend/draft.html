<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>驷马合规 · 广告宣传合规起草助手</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#eef4ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:auto;padding:34px 20px 60px}h1{font-size:30px;margin:0 0 9px}.lead,.hint,footer{color:#aebbd0;line-height:1.7}.card{margin-top:24px;padding:22px;border:1px solid #263550;border-radius:14px;background:#111b2e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#cbd7ea}input,select,textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #344563;border-radius:8px;background:#0c1525;color:#eef4ff;font:inherit}textarea{min-height:92px;resize:vertical}.full{grid-column:1/-1}.notice{margin:14px 0;padding:12px;border-left:3px solid #60a5fa;background:#0d1b31;color:#c8d6ec;font-size:13px;line-height:1.65}.consent{display:flex;gap:8px;align-items:flex-start;margin:15px 0;font-size:13px;color:#c8d6ec}.consent input{width:auto;margin:4px 0 0}button{min-height:44px;padding:0 17px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:700 14px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.result{display:none;margin-top:18px;padding:18px;border:1px solid #2d5a48;border-radius:10px;background:#0e211d}.status{font-weight:700;color:#8de6b2}.copy{white-space:pre-wrap;line-height:1.75;margin-top:12px}.meta{margin-top:14px;padding-top:12px;border-top:1px solid #28483e;color:#b7c9c1;font-size:13px;line-height:1.7}.error{display:none;margin-top:14px;color:#ffb4ad;font-size:13px}@media(max-width:640px){.wrap{padding:24px 16px}.grid{grid-template-columns:1fr}h1{font-size:25px}.full{grid-column:auto}}
</style>
<main class="wrap"><h1>广告宣传合规起草助手</h1><p class="lead">仅根据已确认事实生成待审版本；系统会自动调用同一审查规则复核。</p><section class="card"><div class="notice">首版仅支持医疗健康与电商促销文字物料。请勿提交个人敏感信息、国家秘密、商业秘密或未公开完整业务材料。</div><div class="grid"><label>行业<select id="industry"><option value="medical">医疗健康</option><option value="ecommerce">电商促销</option></select></label><label>发布媒介<select id="medium"><option>图文</option><option>详情页</option><option>落地页</option><option>短视频</option><option>直播口播</option></select></label><label>产品或服务名称<input id="name" placeholder="必填"></label><label>产品或服务类别<input id="type" placeholder="必填"></label><label class="full">已确认事实<textarea id="facts" placeholder="只填写可核验事实，必填"></textarea></label><label class="full">希望表达的重点<textarea id="goal" placeholder="必填"></textarea></label><label class="full">已有证明材料<textarea id="proof" placeholder="选填；仅概述材料类型，不上传文件"></textarea></label><label data-industry="medical">医疗监管类别<input id="category" placeholder="医疗健康填写"></label><label data-industry="medical">批准、注册或备案信息<input id="approval" placeholder="医疗健康按需填写"></label><label class="full" data-industry="medical">获准发布的广告文字<input id="approved" placeholder="医疗健康按需填写"></label><label data-industry="ecommerce">实际宣传价格及依据<input id="price" placeholder="电商促销填写"></label><label data-industry="ecommerce">活动起止时间<input id="period" placeholder="电商促销填写"></label><label data-industry="ecommerce">适用商品、地区和人群<input id="scope" placeholder="电商促销填写"></label><label data-industry="ecommerce">优惠门槛、限购或库存条件<input id="conditions" placeholder="电商促销填写"></label><label data-industry="ecommerce">原价、比较价格或折扣依据<input id="basis" placeholder="涉及比较时填写"></label></div><label class="consent"><input id="consent" type="checkbox">我确认输入内容为可用于起草的事实资料，并理解输出仅为待审版本，不得直接发布。</label><button id="submit" onclick="draft()">生成并内部审查</button><p class="error" id="error"></p><div class="result" id="result"><div class="status" id="status"></div><div class="copy" id="copy"></div><div class="meta" id="meta"></div></div></section><footer>驷马合规 · 文字起草与内部审查辅助 · 联系邮箱：14712502@qq.com</footer></main>
<script>
const $=id=>document.getElementById(id);function switchIndustry(){document.querySelectorAll('[data-industry]').forEach(item=>item.hidden=item.dataset.industry!==$('industry').value)}$('industry').addEventListener('change',switchIndustry);switchIndustry();function details(){return $('industry').value==='ecommerce'?{sale_price:$('price').value.trim(),promotion_period:$('period').value.trim(),applicable_scope:$('scope').value.trim(),promotion_conditions:$('conditions').value.trim(),reference_price_basis:$('basis').value.trim()}:{regulatory_category:$('category').value.trim(),approval_or_registration:$('approval').value.trim(),approved_ad_text:$('approved').value.trim()}}async function draft(){const error=$('error'),button=$('submit');error.style.display='none';const body={industry:$('industry').value,medium:$('medium').value,product_name:$('name').value.trim(),product_type:$('type').value.trim(),verified_facts:$('facts').value.trim(),desired_message:$('goal').value.trim(),proof_materials:$('proof').value.trim(),details:details(),terms_accepted:$('consent').checked};button.disabled=true;try{const response=await fetch('/api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!data.ok)throw Error(data.error||'起草未完成');$('result').style.display='block';$('status').textContent=data.publication_status;$('copy').textContent=data.draft_text;const meta=['版本校验码：'+data.draft_version,'内部审查：'+(data.internal_review?.risk_level||'待审查'),'生成说明：'+(data.ai_generation_notice||'')];if(data.missing_materials?.length)meta.push('待补材料：'+data.missing_materials.join('；'));if(data.excluded_claims?.length)meta.push('未采用主张：'+data.excluded_claims.join('；'));$('meta').textContent=meta.join('\n')}catch(e){error.textContent=e.message||'起草未完成';error.style.display='block'}finally{button.disabled=false}}</script>
<script>
const conditionalMaterials=document.createElement('div');conditionalMaterials.id='conditional-materials';conditionalMaterials.className='grid';conditionalMaterials.hidden=true;conditionalMaterials.innerHTML='<label class="full" data-conditional="cosmetic">化妆品备案/注册及功效依据摘要<textarea id="cosmetic-materials" placeholder="高风险功效主张必填；只概述已核验材料"></textarea></label><label data-conditional="live">商品销售者、直播间运营者和主播角色<input id="live-roles" placeholder="高风险直播主张必填"></label><label data-conditional="live">直播话术、字幕和商品卡版本<input id="live-assets" placeholder="高风险直播主张必填"></label>';
document.querySelector('.consent').before(conditionalMaterials);const baseDetails=details;details=()=>{const value=baseDetails();if($('industry').value==='ecommerce')Object.assign(value,{cosmetic_compliance_materials:$('cosmetic-materials').value.trim(),live_roles:$('live-roles').value.trim(),live_assets:$('live-assets').value.trim()});return value};function refreshConditionalMaterials(){const ecommerce=$('industry').value==='ecommerce',cosmetic=ecommerce&&$('type').value.includes('化妆品'),live=ecommerce&&['直播口播','直播'].includes($('medium').value);conditionalMaterials.hidden=!cosmetic&&!live;document.querySelectorAll('[data-conditional="cosmetic"]').forEach(item=>item.hidden=!cosmetic);document.querySelectorAll('[data-conditional="live"]').forEach(item=>item.hidden=!live)}['industry','medium','type','goal'].forEach(id=>$(id).addEventListener('input',refreshConditionalMaterials));$('industry').addEventListener('change',refreshConditionalMaterials);$('medium').addEventListener('change',refreshConditionalMaterials);refreshConditionalMaterials();
</script>
</html>
