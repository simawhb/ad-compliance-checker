<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新高考选科匹配 · 驷马报考</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"Helvetica Neue","PingFang SC","SF Pro Text",sans-serif;
  background:linear-gradient(135deg,#dce5f5 0%,#e8dcf5 50%,#dcecf5 100%);
  color:#1a1a2e;min-height:100vh;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale
}
::selection{background:rgba(67,97,238,.12);color:#1a1a2e}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(67,97,238,.1);border-radius:100px}

/* 背景装饰 */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background-image:radial-gradient(rgba(67,97,238,.10) 1px, transparent 1px);
  background-size:20px 20px;pointer-events:none;z-index:0
}
body::after{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 350px at 15% 20%,rgba(67,97,238,.15) 0%,transparent 65%),
    radial-gradient(ellipse 400px 400px at 80% 15%,rgba(130,77,255,.12) 0%,transparent 65%),
    radial-gradient(ellipse 300px 250px at 85% 60%,rgba(255,107,107,.10) 0%,transparent 65%),
    radial-gradient(ellipse 350px 280px at 20% 70%,rgba(72,202,228,.12) 0%,transparent 65%),
    radial-gradient(ellipse 400px 200px at 50% 95%,rgba(67,97,238,.08) 0%,transparent 65%);
  pointer-events:none;z-index:0;
  animation:atmo 20s ease-in-out infinite alternate
}
@keyframes atmo{
  0%{transform:translate(0,0) scale(1)}
  33%{transform:translate(1.5%,-1%) scale(1.01)}
  66%{transform:translate(-1%,1.5%) scale(1.02)}
  100%{transform:translate(0.5%,-0.5%) scale(1)}
}

/* 卡片通用 */
.glass-card{
  background:#fff;
  border:1px solid #b8c0d0;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  transition:all .3s cubic-bezier(.25,.1,.25,1);
  border-radius:16px;padding:28px
}
.glass-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.10);transform:translateY(-2px)}

.container{max-width:800px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Header */
.header{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  border-bottom:1px solid #b8c0d0;
  padding:16px;text-align:center;position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:center
}
.header::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;
  height:1px;background:linear-gradient(90deg,transparent,rgba(67,97,238,.25),transparent)
}
.header h1{font-size:18px;font-weight:700;color:#1a1a2e}
.header .back{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:#6b6b8d;background:none;border:none;font-size:15px;cursor:pointer;
  padding:6px 12px;border-radius:8px;transition:all .2s
}
.header .back:hover{color:#1a1a2e;background:rgba(67,97,238,.06)}

/* 介绍 */
.intro{font-size:14px;color:#6b6b8d;line-height:1.8;margin-bottom:16px}
.intro strong{color:#1a1a2e}

/* 分组标签 */
.group-tabs{
  display:flex;gap:4px;
  background:#fff;
  border:1px solid #b8c0d0;
  border-radius:12px;padding:4px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)
}
.group-tab{
  flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:500;transition:all .2s
}

/* 组合卡片网格 */
.comb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.comb-card{
  padding:16px;border-radius:14px;cursor:pointer;transition:all .25s;
  background:#fff;
  border:1px solid #b8c0d0;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative
}
.comb-card:active{transform:scale(.97)}
.comb-card.selected{
  border-color:#4361ee;
  background:#edf2ff;
  box-shadow:0 2px 16px rgba(67,97,238,.15)
}
.comb-card .comb-code{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.comb-card .comb-name{font-size:12px;color:#6b6b8d;margin-bottom:6px}
.comb-card .comb-rate{font-size:20px;font-weight:700}
.comb-card .comb-label{font-size:11px;color:#9a9ab0}
.comb-card .comb-badge{
  position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.comb-badge-physics{background:rgba(67,97,238,.12);color:#4361ee}
.comb-badge-history{background:rgba(255,159,10,.15);color:#e8850c}
.rate-high{color:#2ec4b6}
.rate-mid{color:#e8850c}
.rate-low{color:#e63946}

/* 详情面板 */
.detail-section{margin-bottom:16px}
.detail-header{
  background:#fff;
  border:1px solid #b8c0d0;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border-radius:14px;padding:18px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px
}
.detail-header .dh-code{font-size:28px;font-weight:700;color:#1a1a2e}
.detail-header .dh-name{font-size:14px;color:#6b6b8d}
.detail-header .dh-rate{font-size:32px;font-weight:800;text-align:right}
.detail-header .dh-rate-label{font-size:12px;color:#9a9ab0;text-align:right}
.detail-header .dh-desc{font-size:13px;color:#6b6b8d;margin-top:6px;line-height:1.6}

/* 门类列表 */
.cat-list{display:flex;flex-direction:column;gap:8px}
.cat-item{
  background:#fff;
  border:1px solid #b8c0d0;
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s;
  box-shadow:0 2px 8px rgba(0,0,0,.06)
}
.cat-item:active{background:rgba(67,97,238,.04)}
.cat-item .cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cat-item .cat-name{font-size:15px;font-weight:600;color:#1a1a2e}
.cat-item .cat-count{font-size:12px;color:#8a8aaa}
.cat-item .cat-details{display:flex;flex-wrap:wrap;gap:4px}
.cat-item .cat-detail-tag{
  padding:3px 8px;border-radius:6px;font-size:11px;
  background:rgba(67,97,238,.1);color:#4361ee
}
.cat-item .cat-detail-tag.restricted{background:rgba(230,57,70,.1);color:#e63946;text-decoration:line-through}

/* 排名条 */
.rank-section{
  background:#fff;
  border:1px solid #b8c0d0;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border-radius:16px;padding:20px
}
.rank-section .rank-title{font-size:15px;font-weight:600;margin-bottom:12px;color:#1a1a2e}
.rank-item{display:flex;align-items:center;margin-bottom:6px;gap:8px;padding:4px 0}
.rank-item .rank-num{width:20px;font-size:12px;color:#8a8aaa;text-align:center;font-weight:600}
.rank-item .rank-code{width:56px;font-size:13px;font-weight:600;color:#1a1a2e}
.rank-item .rank-bar-wrap{flex:1;height:20px;background:#e4e8f0;border-radius:10px;overflow:hidden}
.rank-item .rank-bar-fill{height:100%;border-radius:10px;display:flex;align-items:center;padding-left:6px;transition:width .5s}
.rank-bar-high{background:linear-gradient(90deg,#2ec4b6,#20b2aa)}
.rank-bar-mid{background:linear-gradient(90deg,#e8850c,#ff9f0a)}
.rank-bar-low{background:linear-gradient(90deg,#e63946,#ff6b6b)}
.rank-bar-fill .rank-pct{font-size:11px;color:#fff;font-weight:600}

/* 加载/空状态 */
.loading{text-align:center;padding:32px;color:#8a8aaa;font-size:14px}
.loading .spinner{
  display:inline-block;width:24px;height:24px;
  border:3px solid rgba(67,97,238,.08);
  border-top-color:#4361ee;
  border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;margin-right:8px
}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:32px;color:#e63946;font-size:14px}

@media(max-width:480px){
  .comb-grid{grid-template-columns:1fr 1fr}
  .comb-card{padding:12px}
  .comb-card .comb-code{font-size:18px}
  .glass-card{padding:20px}
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <button class="back" @click="goHome">← 返回</button>
    <h1>新高考选科匹配</h1>
  </div>

  <div class="container">
    <!-- Intro -->
    <div class="intro glass-card">
      <strong>新高考3+1+2模式</strong>下，选科组合决定可报考的专业范围。
      点击下方任一组合，查看可报考的专业门类及比例。
    </div>

    <!-- Loading -->
    <div class="loading" v-if="loading"><span class="spinner"></span>加载数据中...</div>

    <!-- Error -->
    <div class="error" v-if="errorMsg">{{ errorMsg }}</div>

    <template v-if="!loading && !errorMsg">
      <!-- Group Tabs -->
      <div class="group-tabs" v-if="groups">
        <div class="group-tab"
             :style="activeGroup==='all'?{background:'#4361ee',color:'#fff'}:{color:'#6b6b8d'}"
             @click="activeGroup='all'">全部 ({{ combinations.length }})</div>
        <div class="group-tab"
             :style="activeGroup==='物理'?{background:'#4361ee',color:'#fff'}:{color:'#6b6b8d'}"
             @click="activeGroup='物理'">物理方向 ({{ groups['物理']?.length || 0 }})</div>
        <div class="group-tab"
             :style="activeGroup==='历史'?{background:'#4361ee',color:'#fff'}:{color:'#6b6b8d'}"
             @click="activeGroup='历史'">历史方向 ({{ groups['历史']?.length || 0 }})</div>
      </div>

      <!-- 组合卡片 -->
      <div class="comb-grid">
        <div class="comb-card"
             v-for="c in filteredCombinations"
             :key="c.code"
             :class="{selected: selectedCode === c.code}"
             @click="selectCombination(c.code)">
          <div class="comb-badge"
               :class="c.group === '物理' ? 'comb-badge-physics' : 'comb-badge-history'">
            {{ c.group }}
          </div>
          <div class="comb-code">{{ c.code }}</div>
          <div class="comb-name">{{ c.name }}</div>
          <div class="comb-rate" :class="c.match_rate >= 90 ? 'rate-high' : (c.match_rate >= 60 ? 'rate-mid' : 'rate-low')">
            {{ c.match_rate }}%
          </div>
          <div class="comb-label">可报专业类</div>
        </div>
      </div>

      <!-- 组合排名预览 -->
      <div class="rank-section" v-if="!selectedCode">
        <div class="rank-title">各组合可报专业类比例排名</div>
        <div class="rank-item" v-for="(c, i) in combinations" :key="c.code">
          <span class="rank-num">{{ i + 1 }}</span>
          <span class="rank-code">{{ c.code }}</span>
          <div class="rank-bar-wrap">
            <div class="rank-bar-fill" :class="barClass(c.match_rate)"
                 :style="{width: c.match_rate + '%'}">
              <span class="rank-pct" v-if="c.match_rate > 15">{{ c.match_rate }}%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 选中组合的详情 -->
      <div class="detail-section" v-if="detail">
        <div class="detail-header">
          <div class="dh-left">
            <div class="dh-code">{{ detail.code }}</div>
            <div class="dh-name">{{ detail.name }}</div>
            <div class="dh-desc">{{ detail.description }}</div>
          </div>
          <div>
            <div class="dh-rate" :class="detail.match_rate >= 90 ? 'rate-high' : (detail.match_rate >= 60 ? 'rate-mid' : 'rate-low')">
              {{ detail.match_rate }}%
            </div>
            <div class="dh-rate-label">
              可报 {{ detail.available_detail_categories }}/{{ detail.total_detail_categories }} 专业类
            </div>
          </div>
        </div>

        <!-- 可报门类列表 -->
        <div class="cat-list">
          <div class="cat-item" v-for="cat in detail.categories" :key="cat.category"
              :class="{ 'cat-restricted': cat.restricted }">
            <div class="cat-header">
              <span class="cat-name">{{ cat.category }}</span>
              <span class="cat-count">{{ cat.detail_categories.length }} 个专业类</span>
            </div>
            <div class="cat-details">
              <span class="cat-detail-tag" v-for="d in cat.detail_categories" :key="d">{{ d }}</span>
              <span class="cat-detail-tag restricted" v-for="d in cat.restricted_detail_categories" :key="'r-'+d">{{ d }}</span>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

createApp({
  setup() {
    const apiBase = '/api';
    const loading = ref(true);
    const errorMsg = ref('');
    const combinations = ref([]);
    const groups = ref(null);
    const selectedCode = ref('');
    const detail = ref(null);
    const activeGroup = ref('all');

    onMounted(async () => {
      await loadCombinations();
    });

    async function loadCombinations() {
      loading.value = true;
      errorMsg.value = '';
      try {
        const r = await fetch(apiBase + '/subject/combinations');
        const d = await r.json();
        if (d.error) {
          errorMsg.value = d.error;
          return;
        }
        combinations.value = d.combinations || [];
        groups.value = d.groups || null;
        // 默认选中第一个（物化生）
        if (combinations.value.length > 0) {
          selectedCode.value = combinations.value[0].code;
          await loadDetail(selectedCode.value);
        }
      } catch (e) {
        errorMsg.value = '数据加载失败，请检查网络连接';
      }
      loading.value = false;
    }

    async function loadDetail(code) {
      detail.value = null;
      try {
        const r = await fetch(apiBase + '/subject/match?combination=' + encodeURIComponent(code));
        const d = await r.json();
        if (d.error) return;
        detail.value = d;
      } catch (e) {
        // silent
      }
    }

    async function selectCombination(code) {
      selectedCode.value = code;
      await loadDetail(code);
    }

    function goHome() {
      window.location.href = '/';
    }

    function barClass(rate) {
      if (rate >= 90) return 'rank-bar-high';
      if (rate >= 60) return 'rank-bar-mid';
      return 'rank-bar-low';
    }

    const filteredCombinations = computed(() => {
      if (activeGroup.value === 'all') return combinations.value;
      return combinations.value.filter(c => c.group === activeGroup.value);
    });

    return {
      loading, errorMsg, combinations, groups,
      selectedCode, detail, activeGroup,
      filteredCombinations, barClass,
      selectCombination, goHome, loadDetail,
    };
  }
}).mount('#app');
</script>
</body>
</html>
