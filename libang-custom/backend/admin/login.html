<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>力邦营养定制版 · 管理登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f6fa;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:32px;width:92%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h2{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center;color:#0d0d0d}
h2 small{display:block;font-size:12px;font-weight:400;color:#6b7280;margin-top:4px}
input{width:100%;padding:12px;border:1px solid #e8ecf0;border-radius:10px;font-size:14px;margin-bottom:12px}
input:focus{outline:none;border-color:#2563eb}
button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
.error{color:#ef4444;font-size:13px;text-align:center;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card">
<h2>管理后台 <small>力邦营养企业定制版</small></h2>
<form onsubmit="login(event)">
<input id="pwd" type="password" placeholder="管理员密码" autofocus>
<button type="submit">登录</button>
<div class="error" id="err"></div>
</form>
</div>
<script>
async function login(e){
  e.preventDefault();
  var pwd=document.getElementById('pwd').value;
  if(!pwd)return;
  var r=await fetch(document.location.origin+'/api/health',{headers:{'X-Admin-Key':pwd}});
  if(r.ok){
    document.cookie='admin_ok=1;path=/';
    location.href='/admin/index.html';
  }else{
    document.getElementById('err').style.display='block';
    document.getElementById('err').textContent='密码错误';
  }
}
</script>
</body>
</html>
