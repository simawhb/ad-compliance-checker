# =============================================================================
# 4ma.wang — 王老师的工具集 · Nginx 主配置
# 部署路径: /etc/nginx/sites-available/4ma.wang
# 启用: ln -s /etc/nginx/sites-available/4ma.wang /etc/nginx/sites-enabled/
#
# 端口分配表（127.0.0.1 本地）
# ─────────────────────────────────────────
#  8000  → 原版广告审查助手 (checker.4ma.wang)
#  8001  → 企业定制版广告审查助手 (/ad-check/)
#  8002  → 驷马粮选 (/liangxuan/)
#  8003+ → 预留未来新工具
#
# 添加新工具的步骤:
# 1. 在服务器上启动后端服务，监听 127.0.0.1:800X
# 2. 在下方 "===== 工具路由 =====" 区域添加 location /new-tool/ 块
# 3. nginx -t && systemctl reload nginx
# 4. 在 portal 首页加一个卡片链接
# =============================================================================

# ============ 主站 HTTP → HTTPS ============
server {
    listen 80;
    server_name 4ma.wang www.4ma.wang;
    return 301 https://$host$request_uri;
    server_tokens off;
}

# ============ 主站 HTTPS ============
server {
    listen 443 ssl http2;
    server_name 4ma.wang www.4ma.wang;

    ssl_certificate /etc/letsencrypt/live/4ma.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4ma.wang/privkey.pem;

    # -------- 全局安全头 --------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    server_tokens off;
    client_max_body_size 10M;

    # =============================
    #  门户首页
    # =============================
    location / {
        root /var/www/4ma.wang;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 API 文档
    location ~ ^/(docs|openapi.json|redoc)$ {
        return 404;
    }

    # =============================
    #  工具路由
    #  每条路由格式：
    #  location /tool-name/ {
    #      proxy_pass http://127.0.0.1:800X/;
    #      proxy_set_header ...;
    #  }
    # =============================

    # --- 企业定制版广告审查助手（密码保护 | 端口 8001）---
    location /ad-check/ {
        auth_basic "企业定制版 — 请输入访问密码";
        auth_basic_user_file /etc/nginx/.htpasswd_libang;

        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 驷马粮选（端口 8002）---
    location /liangxuan/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 原有管理后台（保留 | 端口 8000）---
    location /admin/ {
        auth_basic "管理后台";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- C盘清理下载（静态文件）---
    location /c-clean/ {
        alias /var/www/download/;
        index index.html;
    }

    # =============================
    #  未来工具在此添加（示例）
    # =============================
    # location /new-tool/ {
    #     proxy_pass http://127.0.0.1:8003/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# =============================================================================
#  子域名配置
#  新增子域名时，在此添加 server 块 + 申请 SSL 证书
# =============================================================================

# ---------- checker.4ma.wang — 原版广告审查助手（公开 | 端口 8000）----------

server {
    listen 80;
    server_name checker.4ma.wang;

    location /.well-known/acme-challenge/ {
        root /var/www/4ma.wang;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name checker.4ma.wang;

    ssl_certificate /etc/letsencrypt/live/checker.4ma.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checker.4ma.wang/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    server_tokens off;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

